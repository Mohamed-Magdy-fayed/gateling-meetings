# Local-only LiveKit server config, used by `npm run livekit` (scripts/livekit-dev.mjs).
# Never deploy this: the API key/secret are the well-known dev pair.
port: 7880
keys:
  devkey: secret
rtc:
  tcp_port: 7881
  # A narrow UDP range — Docker Desktop publishes each port individually, so
  # LiveKit's default 50000-60000 takes minutes to start. 100 ports is plenty
  # for a laptop's worth of participants.
  port_range_start: 50000
  port_range_end: 50100
  # Advertise the host loopback as the ICE candidate. Inside Docker the
  # container's own address is unreachable from a browser on the host;
  # 127.0.0.1 is where Docker's port forwards actually listen. ICE/TCP on
  # 7881 is the fallback when UDP forwarding is flaky.
  node_ip: 127.0.0.1
  use_external_ip: false
logging:
  level: info
# Post room/participant events to the dev server, exactly as LiveKit Cloud
# does in production, so the attendance log and outbound integration
# webhooks work locally too. Needs `npm run dev` and `npm run inngest`
# (the handler hands events to Inngest). `host.docker.internal` is Docker
# Desktop's name for the machine running the container.
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/livekit/webhook
